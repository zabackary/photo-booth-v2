name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (x86_64 Linux)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            libclang-dev \
            pkg-config \
            libssl-dev \
            libgphoto2-dev \
            libcups2-dev \
            libgl-dev \
            libxkbcommon-dev \
            libvulkan-dev \
            libwayland-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libx11-dev \
            libv4l-dev

      - name: Set LIBCLANG_PATH
        run: echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --features mock

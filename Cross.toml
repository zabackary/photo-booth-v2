[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get install --assume-yes build-essential clang libclang-dev libssl-dev:$CROSS_DEB_ARCH"
]

[target.x86_64-apple-darwin]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get install --assume-yes build-essential libssl-dev:$CROSS_DEB_ARCH libgphoto2-dev:$CROSS_DEB_ARCH"
]